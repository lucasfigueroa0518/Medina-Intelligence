name = "medina-ventures-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Wave 5.6: ship the vendored pdfjs serverless bundle (src/lib/pdfjs-
# vendor/pdfjs.mjs, ~1.6 MB raw, ~400-500 KB compressed) as an
# unprocessed Worker additional module. Without this, esbuild
# transforms the single-line Rollup output and breaks pdfjs's static-
# class-block semantics ("Ch is not a constructor" / "Object.
# defineProperty called on non-object" / "Cannot set properties of
# undefined"). The rules block matches the vendored file and preserves
# it verbatim in the Worker bundle.
find_additional_modules = true
[[rules]]
type = "ESModule"
globs = ["lib/pdfjs-vendor/**/*.mjs"]
fallthrough = true

[vars]
ENVIRONMENT = "production"
CLOUDFLARE_ACCOUNT_ID = "ad54df3fe69483d2c0b69be1b72864e8"
CLOUDFLARE_AI_GATEWAY_SLUG = "medina-ventures"
# Self-imposed Gemini rate limit. Google Tier 1 (pay-as-you-go) actually
# allows 1000 RPM for Gemini 2.5 Flash; we throttle to 500 as a safety
# buffer so a runaway loop can't burn the day's quota. The rate-limit.ts
# checker uses this value; the Command Center capacity gauge displays it.
GEMINI_MAX_RPM = "500"
ALLOWED_ORIGINS = "https://medinaventures.ai,https://www.medinaventures.ai,http://localhost:3000"
FRONTEND_URL = "https://medinaventures.ai"
DECK_RENDERER_ENABLED = "true"
DECK_RENDERER_PROVIDER = "cloudflare"

[browser]
binding = "BROWSER"

[ai]
binding = "AI"

[[d1_databases]]
binding = "D1"
database_name = "medina-ventures-db"
database_id = "4bb3705c-c471-43f7-b42f-b44ab62f5dab"
preview_database_id = "4bb3705c-c471-43f7-b42f-b44ab62f5dab"

[[r2_buckets]]
binding = "R2"
bucket_name = "medina-ventures-storage"
preview_bucket_name = "medina-ventures-storage"

[[kv_namespaces]]
binding = "KV"
id = "29422591253b424d9094c37e0897d68e"
preview_id = "59205fe013c84c548579bc2b503750f6"

[[vectorize]]
binding = "VECTORIZE"
index_name = "medina-ventures-main"
# Metadata indexes (declared out-of-band via `wrangler vectorize
# create-metadata-index`; not configurable via wrangler.toml). Filtered
# queries against any of these fields require the index to exist BEFORE the
# vector is upserted — vectors written before the index won't filter until
# they're re-upserted. Current indexes:
#   - org_id          (string)
#   - document_type   (string)
#   - primary_entity_id (string)
# If the index is ever rebuilt or these are dropped, recreate with:
#   npx wrangler vectorize create-metadata-index medina-ventures-main \
#     --property-name=<field> --type=string

[[vectorize]]
binding = "VECTORIZE_RAG_V2_BGE"
index_name = "medina-rag-v2-bge-768"

[[vectorize]]
binding = "VECTORIZE_RAG_V2_QWEN3"
index_name = "medina-rag-v2-qwen3-1024"

[[vectorize]]
binding = "VECTORIZE_RAG_V2_MINILM"
index_name = "medina-rag-v2-minilm-384"

# --- Workflows ---
#
# Phase 8 strip (2026-05-06): 6 [[workflows]] declarations removed.
# All workflow class ownership transferred to medina-ventures-pipelines
# Worker (wrangler.pipelines.toml). api Worker no longer claims any
# workflow class binding; on deploy, CF reconciles ownership to
# pipelines (the only remaining declarer).
#
# Side effects on api Worker:
#   • env.INGESTION_WORKFLOW / env.ENRICHMENT_WORKFLOW /
#     env.CAMPAIGN_WORKFLOW / etc. bindings no longer exist on api
#   • 3 endpoints break at runtime until follow-up service-binding
#     refactor lands tomorrow:
#       POST /api/admin/trigger-ingestion (admin.ts:465)
#       POST /api/admin/trigger-sync     (admin.ts:543)
#       POST /api/campaigns/:id/send     (campaigns.ts:141)
#   • Tony/Alvaro hold campaign sends for ~45 min during this window
#     (Slack coordination 2026-05-06)
#
# Tomorrow's follow-up: add `[[services]] PIPELINES` binding to this
# config + small `triggerWorkflow` method on pipelines + refactor the
# 3 sites to call via service binding. Restores admin + campaign send.

# --- Cron Triggers ---
#
# Phase 8 strip (2026-05-06): [triggers] section removed. api Worker
# no longer fires any cron. All scheduled work runs on pipelines
# Worker (medina-ventures-pipelines, wrangler.pipelines.toml).
#
# Phase 2 (2026-05-04) historical context (preserved): consolidated 4
# cron triggers → 2 by folding `5 * * * *` (enrichment) and
# `0 0 * * *` (daily cron) into the minute-tick handler with
# time-of-day gates.

# --- Queues ---

[[queues.producers]]
queue = "audit-log-queue"
binding = "AUDIT_QUEUE"

[[queues.consumers]]
queue = "audit-log-queue"
max_batch_size = 50
max_batch_timeout = 10
max_retries = 3
dead_letter_queue = "audit-log-dlq"

[[queues.producers]]
queue = "audit-log-dlq"
binding = "AUDIT_DLQ"

[[queues.consumers]]
queue = "audit-log-dlq"
max_batch_size = 25
max_batch_timeout = 30
max_retries = 1

[[queues.producers]]
queue = "webhook-intake-queue"
binding = "WEBHOOK_QUEUE"

[[queues.consumers]]
queue = "webhook-intake-queue"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "webhook-dlq"
retry_delay = 60

[[queues.producers]]
queue = "webhook-dlq"
binding = "WEBHOOK_DLQ"

[[queues.consumers]]
queue = "webhook-dlq"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 1
