name: Deck Renderer Container

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Container image tag
        required: true
        default: artifact-tool-v1

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: registry.cloudflare.com
          username: ${{ secrets.CF_CONTAINER_REGISTRY_USERNAME }}
          password: ${{ secrets.CF_CONTAINER_REGISTRY_PASSWORD }}

      - uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: services/deck-renderer
          file: services/deck-renderer/Dockerfile
          push: true
          tags: registry.cloudflare.com/${{ secrets.CF_ACCOUNT_ID }}/marty-deck-renderer:${{ inputs.tag }}
