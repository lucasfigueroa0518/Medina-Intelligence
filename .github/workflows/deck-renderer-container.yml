name: Deck Renderer Container

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Container image tag
        required: true
        default: artifact-tool-v1

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: registry.cloudflare.com
          username: ${{ secrets.CF_CONTAINER_REGISTRY_USERNAME }}
          password: ${{ secrets.CF_CONTAINER_REGISTRY_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: services/deck-renderer
          file: services/deck-renderer/Dockerfile
          push: true
          tags: registry.cloudflare.com/${{ secrets.CF_ACCOUNT_ID }}/marty-deck-renderer:${{ inputs.tag }}
