name: Secrets scan

# Gitleaks over the FULL history (fetch-depth: 0) on every PR and push
# to main. Catches committed credentials before they land — and because
# depth is full, any pre-existing leak in history keeps failing the scan
# until it is rotated + rewritten or explicitly allowlisted in a
# .gitleaks.toml with a documented reason.
#
# Free for user-owned repos (an org repo would need GITLEAKS_LICENSE).
# Pinned by SHA like every other action here.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
