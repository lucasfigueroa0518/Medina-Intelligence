name: Secrets scan

# TRUE full-history gitleaks scan on every PR and push to main — the
# binary is invoked DIRECTLY so scan scope cannot depend on event type
# (gitleaks-action v2 silently narrows PR events to the PR's commit
# range; audit round-2 caught our first version claiming full-history
# while scanning 1 commit). Binary release is checksum-pinned, same
# trust posture as the SHA-pinned actions.
#
# .gitleaks-baseline.json holds KNOWN, redacted historical findings
# (values never stored): they are tracked for rotation/cleanup without
# permanently failing every PR, while any NEW leak fails immediately.
# Removing entries from the baseline as history is cleaned tightens the
# gate; adding entries requires the same scrutiny as an allowlist.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks full history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1 (checksum-pinned)
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan full history (new leaks fail; baseline tracked)
        run: |
          ./gitleaks detect --source . --redact --exit-code 1 \
            --baseline-path .gitleaks-baseline.json --verbose
          echo "scanned full history; findings beyond the $(node -e 'console.log(require("./.gitleaks-baseline.json").length)')-entry baseline would have failed this step"
