name: Config check

# Wrangler config drift gate — encodes the canonical [vars] parity set,
# documented intentional divergences, cron-trigger expectations, and
# shared infra identity across the four wrangler configs. Dependency-free
# (no npm install), so it stays fast enough to be a required check.
on:
  pull_request:
    paths:
      - 'wrangler*.toml'
      - 'scripts/check-wrangler-drift.mjs'
      - '.github/workflows/config-check.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  wrangler-drift:
    name: wrangler config drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/check-wrangler-drift.mjs
