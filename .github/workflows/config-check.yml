name: Config check

# Wrangler config drift gate — encodes the canonical [vars] parity set,
# documented intentional divergences, cron-trigger expectations, and
# shared infra identity across the four wrangler configs. Dependency-free
# (no npm install) and runs in seconds, so it runs on EVERY PR — no
# paths filter: a filtered job can never be a branch-protection
# required check (PRs not touching the paths would wait on a check
# that never reports).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  wrangler-drift:
    name: wrangler config drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-wrangler-drift.mjs
