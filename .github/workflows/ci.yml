name: CI

# Quality gates only — no deploys. Worker deploys stay manual
# (`npm run deploy` / `deploy:pipelines`); Vercel deploys off origin/main.
#
# Actions are pinned to full commit SHAs (tag in the trailing comment):
# a moving major tag is a supply-chain trust in whoever controls the tag.
# Update pins deliberately — resolve the new tag's SHA and change both.
# Node version comes from .nvmrc (single source of truth with local dev).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run

  frontend:
    name: frontend typecheck + lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Production build as a compile-level regression gate. No secrets:
      # NEXT_PUBLIC_* values are compile-time inlined and the app must
      # tolerate their absence (it falls back to same-origin/localhost).
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
