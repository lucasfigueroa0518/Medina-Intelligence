# Phase 8 (2026-05-06) — pipelines Worker config.
#
# This Worker handles all background work: cron-driven ingestion +
# enrichment + work_queue handlers + workflow orchestration + audit
# queue consumption. Webhook intake (`/webhooks/*`) deferred to
# Session B per dispatch.
#
# Bundled deploy: pipelines ships with EVERYTHING (handlers, crons,
# workflow class exports, audit consumer). The api Worker keeps its
# copy until the second deploy in this session, when api's wrangler.toml
# loses [triggers] + workflow declarations + audit consumer.
#
# Rollback: pipelines is a brand-new Worker; no prior version exists.
# If this deploy fails, the rollback is `wrangler delete --config
# wrangler.pipelines.toml medina-ventures-pipelines` (full delete), NOT
# `wrangler rollback`. api Worker is untouched by this deploy and
# continues serving on its own version.

name = "medina-ventures-pipelines"
main = "src/pipelines-index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# pdfjs vendored bundle (mirrors api). Pipelines may not currently use
# pdfjs but matching configuration keeps esbuild behavior identical
# across both Workers and avoids surprise if shared modules pull pdfjs
# transitively.
find_additional_modules = true
[[rules]]
type = "ESModule"
globs = ["lib/pdfjs-vendor/**/*.mjs"]
fallthrough = true

[vars]
ENVIRONMENT = "production"
CLOUDFLARE_ACCOUNT_ID = "ad54df3fe69483d2c0b69be1b72864e8"
CLOUDFLARE_AI_GATEWAY_SLUG = "medina-ventures"
GEMINI_MAX_RPM = "500"
# ALLOWED_ORIGINS + FRONTEND_URL only matter for CORS-aware fetch
# handlers; pipelines's only public endpoint is /health which returns
# JSON without CORS sensitivity. Keeping them parity for now.
ALLOWED_ORIGINS = "https://medinaventures.ai,https://www.medinaventures.ai,http://localhost:3000"
FRONTEND_URL = "https://medinaventures.ai"

[ai]
binding = "AI"

[[d1_databases]]
binding = "D1"
database_name = "medina-ventures-db"
database_id = "4bb3705c-c471-43f7-b42f-b44ab62f5dab"
preview_database_id = "4bb3705c-c471-43f7-b42f-b44ab62f5dab"

[[r2_buckets]]
binding = "R2"
bucket_name = "medina-ventures-storage"
preview_bucket_name = "medina-ventures-storage"

[[kv_namespaces]]
binding = "KV"
id = "29422591253b424d9094c37e0897d68e"
preview_id = "59205fe013c84c548579bc2b503750f6"

[[vectorize]]
binding = "VECTORIZE"
index_name = "medina-ventures-main"

# --- Workflows ---
#
# All 6 workflow class declarations move to pipelines. After this
# deploy, the workflow runtime executes pipelines' class
# implementations. api still has matching declarations until the
# api redeploy in Session A's second deploy phase.

[[workflows]]
name = "ingestion-workflow"
binding = "INGESTION_WORKFLOW"
class_name = "IngestionWorkflow"

[[workflows]]
name = "ingestion-chunk-workflow"
binding = "INGESTION_CHUNK_WORKFLOW"
class_name = "IngestionChunkWorkflow"

[[workflows]]
name = "ingestion-finalizer-workflow"
binding = "INGESTION_FINALIZER_WORKFLOW"
class_name = "IngestionFinalizerWorkflow"

[[workflows]]
name = "enrichment-workflow"
binding = "ENRICHMENT_WORKFLOW"
class_name = "EnrichmentWorkflow"

[[workflows]]
name = "campaign-send-workflow"
binding = "CAMPAIGN_WORKFLOW"
class_name = "CampaignSendWorkflow"

[[workflows]]
name = "daily-cron-workflow"
binding = "DAILY_CRON_WORKFLOW"
class_name = "DailyCronWorkflow"

# --- Cron Triggers ---
#
# Same two crons as api currently has. During the overlap window
# between this deploy and api redeploy, BOTH Workers fire these crons.
# work_queue claim atomicity covers handler arbitration; non-arbitrated
# paths (workflow create, daily cron at 02:10) double-fire — accepted
# cost per dispatch decision 4. Hard cutoff: api redeploy must
# complete before 01:40 UTC to leave 30-min clearance before 02:10
# daily cron fires; if Phases 1-4 verification still in flight at
# 01:30 UTC, abort api redeploy for tonight and accept duplicate
# daily cron at 02:10 as wasted-work-not-corruption.

[triggers]
crons = [
  "0 * * * *",
  "* * * * *",
]

# --- Queues ---
#
# Audit queue: pipelines is producer + consumer (per dispatch
# decision: audit consumer MOVES to pipelines). api keeps its
# producer binding so it continues to emit user-request audit
# events; api removes its consumer in the second deploy.
#
# Webhook queue: pipelines does NOT register webhook-intake-queue
# producer or consumer in this session. Webhook intake stays on api
# until Session B's Stage 4. api keeps both producer + consumer
# until then.

[[queues.producers]]
queue = "audit-log-queue"
binding = "AUDIT_QUEUE"

[[queues.consumers]]
queue = "audit-log-queue"
max_batch_size = 50
max_batch_timeout = 10
max_retries = 3
dead_letter_queue = "audit-log-dlq"

[[queues.producers]]
queue = "audit-log-dlq"
binding = "AUDIT_DLQ"

[[queues.consumers]]
queue = "audit-log-dlq"
max_batch_size = 25
max_batch_timeout = 30
max_retries = 1
